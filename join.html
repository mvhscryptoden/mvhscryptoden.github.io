<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Join! | CryptoDen MVHS</title>

    <link rel="stylesheet" href="css/global.css"> <!-- GLOBAL IS ALWAYS FIRST -->
    <link rel="stylesheet" href="css/join.css">

    <link rel="icon" type="image/x-icon" href="media/logo.png">

    <script src="https://kit.fontawesome.com/aebd67e261.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div id="bounceTxt" class="logo">CRYPTO DEN</div>

        <nav class="nav-links"> 
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="officers.html">Officers</a>
            <a href="calendar.html">Calendar</a>
            <a href="competition.html">Competition</a>
            <a href="support.html">Support</a>
            <a href="photos.html">Photos</a>
            <a class="nav-active" href="join.html" class="nav-cta">Join</a>
        </nav>
    </header>

    <!-- SECTION CONTENT -->
    <section class="section form">
        <div class="hero-content">
            <h1>Join Crypto Den</h1>
        </div>

        <form action="https://formspree.io/f/moeawggy" method="POST" class="joinForm" id="joinForm" novalidate>
        <label>
            <h4>Full Name: <span class="required">*</span></h4>
            <input type="text" name="name">
        </label>

        <label>
            <h4>Email: <span class="required">*</span></h4>
            <input type="email" name="email">
        </label>

        <label>
            <h4>Additional Information (optional):</h4>
            <input id="optionalFieldId" type="text" name="info">
        </label>
        <!-- your other form fields go here -->
        <button type="submit">Send</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer class="stickyFooter">
        <div class="footerConnect">
            <h3 class="footerConnectTitle">Connect with us</h3>

            <div class="footerLinks">
                <a id="instagramLink" href="https://www.instagram.com/mvhscryptoden/" target="_blank">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a id="githubLink" href="https://www.github.com/mvhscryptoden/" target="_blank">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a class="competitionNav" href="https://www.htmw.com/mvhscryptoden/" target="_blank">
                    <i class="fa-solid fa-chart-line"></i>
                </a>

                <a id="emailLink" href="mailto:mvhscryptoden@gmail.com">
                    <i class="fa-solid fa-envelope"></i>
                </a>
            </div>
        </div>

        <div class="footerBottom">
            <p class="footerCopyright">
                © 2026 Crypto Den | Mission Vista High School
            </p>

            <p class="footerCredit">
                Built by Dawson Spies
            </p>
        </div>
    </footer>

    <script type="module"src="js/global.js"></script>
    <script type="module" src="js/join.js"></script>
</body>
</html>
